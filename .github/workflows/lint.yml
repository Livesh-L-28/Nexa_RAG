name: Python Lint & Syntax Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install Ruff & Flake8
        run: pip install ruff
      - name: Run Syntax Check
        run: ruff check backend/
