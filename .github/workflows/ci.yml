name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint, Format & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff Lint Check
        run: |
          ruff check backend scripts

      - name: Ruff Format Check
        run: |
          ruff format --check backend scripts

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: test
          LLM_PROVIDER: mock
          JWT_SECRET: nexarag_test_jwt_secret_key_32_characters_minimum
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          pytest backend/tests -v --cov=app --cov-report=term-missing

  frontend-checks:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend SPA
        run: npm run build

  docker-checks:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: nexarag-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: nexarag-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Containerized Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [docker-checks]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Docker Compose Services
        run: |
          docker compose up -d --build

      - name: Wait for Services to become Healthy
        run: |
          python3 -c '
          import time, urllib.request, json, sys
          url = "http://localhost:8000/health/ready"
          print("Waiting for backend and pgvector readiness...")
          for i in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as resp:
                      if resp.status == 200:
                          data = json.loads(resp.read().decode())
                          if data.get("status") == "ready":
                              print(f"Backend is ready after {i*2}s!")
                              sys.exit(0)
              except Exception:
                  pass
              time.sleep(2)
          print("Timed out waiting for backend to become ready")
          sys.exit(1)
          '

      - name: Run Automated Deployment Smoke Test
        run: |
          python scripts/verify_deployment.py

      - name: Inspect Container Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Tear Down Docker Compose Services
        if: always()
        run: |
          docker compose down
