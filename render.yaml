databases:
  - name: nexarag-db
    databaseName: nexarag
    user: postgres
    plan: starter
    postgresMajorVersion: 16

services:
  # Backend API Web Service
  - type: web
    name: nexarag-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: nexarag-uploads
      mountPath: /app/data/uploads
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexarag-db
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: nexarag-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /app/data/uploads

  # Frontend React SPA (Static Site)
  - type: web
    name: nexarag-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nexarag-backend
          property: url
